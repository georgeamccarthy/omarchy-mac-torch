[project]
name = "omarchy-mac-torch"
version = "0.1.0"
description = "PyTorch on Apple Silicon GPUs under Linux (Omarchy), via the Honeykrisp Vulkan driver. Unofficial."
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "George A. McCarthy" }]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: C++", "Operating System :: POSIX :: Linux", "Intended Audience :: Developers", "Intended Audience :: Science/Research"]
keywords = ["pytorch", "apple-silicon", "asahi", "omarchy", "vulkan", "honeykrisp", "gpu"]
readme = "README.md"
requires-python = ">=3.13"
# The native extension is built against one torch version (C++ ABI): rebuild it when torch changes.
dependencies = [
    "numpy>=2.5",
    "torch>=2.15",
]

[project.optional-dependencies]
# tools/build_native.py needs ninja and wgpu (for the wgpu-native library and headers it ships)
build = ["ninja", "wgpu>=0.33"]
# the original Python/wgpu-py backend (OMARCHY_MAC_TORCH_BACKEND=python)
python-backend = ["wgpu>=0.33"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omarchy_mac_torch"]
# prebuilt native libraries are git-ignored but belong in the wheel
artifacts = ["omarchy_mac_torch/*.so"]

[project.urls]
Homepage = "https://github.com/georgeamccarthy/omarchy-mac-torch"
Issues = "https://github.com/georgeamccarthy/omarchy-mac-torch/issues"
